# ============================================================
# FILE: application.properties
# PURPOSE: Spring Boot configuration for Tazrout backend.
#          Defines MQTT broker connection, PostgreSQL credentials,
#          WebSocket settings, and server port.
#
# NOTE: The Mosquitto MQTT broker is installed and configured by
#       Mr. Lhacani (networking). Contact him for the broker IP,
#       port, and any authentication credentials.
#
# IMPLEMENTED BY: Mr. Fehis
# ============================================================

# --- Server ---
server.port=8085

# --- PostgreSQL DataSource ---
spring.datasource.url=jdbc:postgresql://localhost:5432/tazrout
spring.datasource.username=postgres
spring.datasource.password=mohamed2006
spring.datasource.driver-class-name=org.postgresql.Driver

# --- JPA / Hibernate ---
 spring.jpa.hibernate.ddl-auto=validate
 spring.jpa.show-sql=false
 spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
 spring.jpa.properties.hibernate.format_sql=true

# --- MQTT Broker (Mosquitto — configured by Mr. Lhacani) ---
# mqtt.broker.url=tcp://192.168.1.100:1883
# mqtt.client.id=tazrout-backend
# mqtt.default.qos=1
# mqtt.connection.timeout=30
# mqtt.keep.alive.interval=60

# --- WebSocket ---
# websocket.endpoint=/api/v1/ws/realtime
# websocket.allowed.origins=*

# --- Gateway Monitoring ---
# gateway.heartbeat.timeout.seconds=90
# gateway.heartbeat.check.interval.seconds=30

# --- Logging ---
# logging.level.dz.tazrout.dashboard=DEBUG
# logging.level.org.eclipse.paho=WARN
