name: tazrout_dashboard
description: "Agricultural IoT smart irrigation dashboard for Tazrout."
publish_to: 'none'

#& Environment Configuration
environment:
  sdk: '>=3.11.0 <4.0.0'

#& Project Dependencies
dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  dio: ^5.4.3
  web_socket_channel: ^3.0.1
  fl_chart: ^0.68.0
  google_fonts: ^6.2.1
  phosphor_flutter: ^2.1.0
  intl: ^0.19.0
  flutter_dotenv: ^5.1.0

#& Development Dependencies
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

#& Flutter Specific Configuration
flutter:
  uses-material-design: true
  assets:
    - assets/fonts/
    - assets/icons/
    - assets/images/
    - .env